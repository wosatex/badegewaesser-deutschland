name: Badegewässerdaten aktualisieren

on:
  schedule:
    # 04:17 UTC täglich. Krumme Minute, damit der Job nicht mit den
    # Zehntausenden anderer Cron-Jobs zur vollen Stunde kollidiert.
    - cron: "17 4 * * *"
  workflow_dispatch:        # manuell auslösbar
  push:
    paths:
      - "scripts/**"        # bei Konnektor-Änderungen sofort neu bauen

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests

      - name: Daten holen
        id: holen
        run: python scripts/build_data.py --out data/badestellen.json
        continue-on-error: true

      - name: Ergebnis prüfen
        run: |
          test -s data/badestellen.json || { echo "Keine Daten geschrieben"; exit 1; }
          python - <<'PY'
          import json
          d = json.load(open("data/badestellen.json", encoding="utf-8"))
          n = len(d["stellen"])
          ok = sum(1 for q in d["quellen"].values() if q.get("ok"))
          print(f"{n} Stellen, {ok} Quellen erfolgreich")
          # Reissleine: ein Einbruch deutet auf einen kaputten Konnektor hin,
          # nicht auf verschwundene Badestellen.
          assert n >= 1500, f"Nur {n} Stellen — verdaechtig wenig, Abbruch"
          PY

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/badestellen.json
          git diff --staged --quiet && echo "Keine Änderung" && exit 0
          git commit -m "Daten: $(date -u +%Y-%m-%d)"
          git push
